---
- name: Install theming packages
  ansible.builtin.include_role:
    name: paru_install
  vars:
    paru_packages: "{{ theming_packages }}"
    paru_label: tema

# O pacote AUR whitesur-gtk-theme só traz a variante 'normal' dos botões
# (ícones planos). A 'alt' (bolinhas coloridas estilo macOS) não é uma
# opção de build do PKGBUILD, então clonamos e rodamos o install.sh oficial
# na mão — vai pra ~/.themes, não precisa de sudo.
- name: Check if WhiteSur-Dark-alt is already built
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.themes/WhiteSur-Dark-alt"
  register: whitesur_alt_theme

- name: Clone WhiteSur-gtk-theme source
  ansible.builtin.git:
    repo: "{{ theming_gtk_theme_alt_repo }}"
    dest: "{{ ansible_env.HOME }}/.cache/whitesur-gtk-theme-src"
    depth: 1
    force: true
  when: not whitesur_alt_theme.stat.exists

- name: Build and install the WhiteSur-Dark-alt variant
  ansible.builtin.command:
    cmd: ./install.sh -a alt -c dark -o normal -t default
    chdir: "{{ ansible_env.HOME }}/.cache/whitesur-gtk-theme-src"
  when: not whitesur_alt_theme.stat.exists
  changed_when: true

# A paleta grayscale (theme_palette em group_vars/all.yml) é renderizada para
# dentro de base_config/ — os arquivos gerados são versionados, então mudança
# de paleta aparece como diff no git.
- name: Render grayscale palette files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ repo_root }}/base_config/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: colors.conf.j2, dest: hypr/colors.conf }
    - { src: colors.css.j2, dest: waybar/colors.css }
    - { src: colors.css.j2, dest: swaync/colors.css }
    - { src: colors.rasi.j2, dest: rofi/colors.rasi }
  loop_control:
    label: "{{ item.dest }}"

- name: Detect if a graphical session is available
  ansible.builtin.set_fact:
    theming_has_session: "{{ (lookup('env', 'DBUS_SESSION_BUS_ADDRESS') | length) > 0 }}"

- name: Warn when no graphical session is detected
  ansible.builtin.debug:
    msg: >-
      Nenhuma sessão gráfica detectada (DBUS_SESSION_BUS_ADDRESS vazio) — pulando
      aplicação de ícone/cursor/tema GTK. Rode com --tags theming de dentro da
      sessão Hyprland para aplicar.
  when: not theming_has_session

- name: Apply GTK theme via gsettings
  ansible.builtin.shell:
    cmd: "gsettings set {{ item.schema }} {{ item.key }} '{{ item.value }}'"
    executable: /bin/bash
  loop:
    - { schema: "org.gnome.desktop.interface", key: "icon-theme", value: "{{ theming_icon_theme }}" }
    - { schema: "org.gnome.desktop.interface", key: "cursor-theme", value: "{{ theming_cursor_theme }}" }
    - { schema: "org.gnome.desktop.interface", key: "gtk-theme", value: "{{ theming_gtk_theme }}" }
    - { schema: "org.gnome.desktop.interface", key: "color-scheme", value: "prefer-dark" }
    # botões de janela à esquerda estilo macOS — Chromium lê o schema gnome
    # direto; o Nemo (família Cinnamon) lê o schema cinnamon
    - { schema: "org.gnome.desktop.wm.preferences", key: "button-layout", value: "{{ theming_button_layout }}" }
    - { schema: "org.cinnamon.desktop.wm.preferences", key: "button-layout", value: "{{ theming_button_layout }}" }
  loop_control:
    label: "{{ item.schema }}.{{ item.key }}"
  when: theming_has_session
  ignore_errors: true
  changed_when: true
