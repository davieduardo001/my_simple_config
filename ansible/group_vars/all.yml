---
# Toda instalação de pacote usa paru (repo oficial e AUR), dentro da janela
# sudoers do site.yml. A única exceção é o bootstrap do próprio paru.

# --- Pacotes base (repo oficial, via paru) ---
pacman_packages:
  - base-devel
  - git
  - curl
  - wget
  - unzip
  - openssl
  - zlib
  - xz
  - readline
  - sqlite
  - github-cli
  - fastfetch
  - fontconfig
  - starship
  - eza
  - bat
  - zoxide
  - fzf
  - btop
  - tmux
  - timeshift
  - reflector

# --- Pacotes legados a remover (idempotente) ---
packages_absent:
  - visual-studio-code-bin
  - rofi-themes-collection-git
  - rofi
  - brave-bin
  - swww
  - hyprpaper
  - ghostty                # substituído por alacritty
  - thunar                 # substituído por nemo
  - thunar-volman
  - dolphin                # substituído por nemo
  - kio-extras             # dependia só do dolphin
  - ffmpegthumbs           # thumbnailer KIO do dolphin — nemo usa tumbler
  - ark                    # substituído por nemo-fileroller
  - mcmojave-circle-icon-theme-git
  - whitesur-icon-theme-git
  - fluent-icon-theme-git
  - quintom-cursor-theme-git

# --- AUR packages ---
# Vazio hoje: o alacritty veio do repo oficial e o ghostty saiu. Os únicos
# pacotes AUR que sobraram vivem em desktop_apps e claude_packages.
aur_packages: []

# --- Claude Code ---
# Pacote AUR, não npm -g: assim o update entra no `paru -Syu` junto com o resto.
claude_packages:
  - claude-code

# --- Hyprland desktop ---
hyprland_packages:
  - hyprland
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - hyprlock
  - hypridle
  - hyprpolkitagent
  - waybar
  - jq            # script de ícones de workspace do waybar (parse hyprctl)
  - socat         # idem — escuta eventos do Hyprland ao vivo, sem polling
  - swaync
  - rofi-wayland
  - alacritty
  - swaybg
  - cliphist
  - grim
  - slurp
  - satty
  - wl-clipboard
  - brightnessctl
  - playerctl
  - pavucontrol
  - pipewire
  - pipewire-alsa
  - pipewire-pulse
  - wireplumber
  - qt5-wayland
  - qt6-wayland
  - noto-fonts
  - noto-fonts-emoji

# --- Apps desktop ---
default_browser: "firefox.desktop"

desktop_apps:
  - nwg-displays         # GUI de monitores — escreve o hypr/monitors.conf
  - nemo
  - nemo-fileroller      # abrir/criar zip, tar, rar (puxa file-roller)
  - tumbler              # miniaturas de arquivo do nemo
  - ffmpegthumbnailer    # miniaturas de vídeo p/ o tumbler
  - gvfs                 # lixeira/montagem/rede (smb/sftp)
  - onlyoffice-bin
  - gnome-calculator
  - syncthing
  - localsend-bin
  - firefox
  - chromium

# --- Rede + Bluetooth (toggles do swaync dependem disso) ---
network_packages:
  - networkmanager
  - bluez
  - bluez-utils
  - blueman
network_services:
  - NetworkManager.service
  - bluetooth.service

# Data/hora via NTP (systemd-timesyncd), habilitado pela role network
system_timezone: America/Sao_Paulo

# --- Login (greetd + tuigreet) ---
greetd_packages:
  - greetd
  - greetd-tuigreet

# --- Neovim / LazyVim ---
neovim_packages:
  - neovim
  - ripgrep
  - fd
  - lazygit
lazyvim_repo: "https://github.com/davieduardo001/lazyvim-config"
lazyvim_dest: "{{ ansible_env.HOME }}/.config/nvim"

# --- Nerd Fonts (pacotes oficiais, via paru) ---
fonts_packages:
  - ttf-cascadia-code-nerd
  - ttf-jetbrains-mono-nerd
  - inter-font  # fonte da UI (waybar/rofi/swaync/GTK/Qt) — a mais próxima open-source da SF Pro do macOS

# --- Icon/cursor/GTK theming ---
theming_packages:
  - apple_cursor
  - whitesur-icon-theme  # AUR — ícones estilo macOS Big Sur
  - sassc                # build dep do WhiteSur-gtk-theme (clonado à mão, ver theming_gtk_theme_alt_repo)
  - qt5ct                # tema escuro p/ apps Qt5
  - qt6ct                # tema escuro p/ apps Qt6 (OnlyOffice etc.)
  - adwaita-qt5          # dá aos apps Qt o visual do Adwaita
  - adwaita-qt6

# O WhiteSur-gtk-theme do AUR só constrói a variante 'normal' dos botões de
# janela (ícones planos). A variante 'alt' — as bolinhas coloridas estilo
# macOS — só sai clonando o repo e rodando o install.sh na mão (role
# theming faz isso, instala em ~/.themes, sem sudo).
theming_gtk_theme_alt_repo: "https://github.com/vinceliuice/WhiteSur-gtk-theme.git"

theming_icon_theme: "WhiteSur-dark"
theming_cursor_theme: "macOS"
theming_gtk_theme: "WhiteSur-Dark-alt"

# Botões da janela à esquerda, ordem fechar/minimizar/maximizar — estilo
# macOS. Chromium lê isso via GSettings pro próprio frame (não é CSD real,
# então continua sem a bolinha colorida — só a posição/ordem mudam).
theming_button_layout: "close,minimize,maximize:"

# --- Paleta Aura (roxo): única fonte de verdade das cores do rice ---
# A role theming renderiza estes valores em base_config/hypr/colors.conf,
# base_config/waybar/colors.css, base_config/swaync/colors.css e
# base_config/rofi/colors.rasi (todos versionados). Trocar a paleta aqui e
# re-rodar `--tags theming` re-tematiza o desktop inteiro.
# Inspirada no tema Aura do Alacritty (fundo #15141b, acento #a277ff).
theme_palette:
  bg: "15141b"
  bg_alt: "1c1a26"
  surface: "26233a"
  surface2: "322e4d"
  border: "3d3a52"
  border_hi: "a277ff"
  text_dim: "9b94ad"
  text: "cbc5da"
  text_hi: "edecee"

# --- Flatpak apps (infra fica pronta; nenhum app por padrão) ---
flatpak_apps: []

# Flatpaks legados a remover
flatpak_apps_absent:
  - app.zen_browser.zen
