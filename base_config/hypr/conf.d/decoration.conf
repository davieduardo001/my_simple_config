# Cantos, blur e sombra — "liquid glass": mais arredondado, mais
# translúcido, blur mais forte com um toque de vibrância pra não ficar
# uma pasta cinza chapada atrás do vidro.
decoration {
    rounding = 16

    active_opacity = 0.94
    inactive_opacity = 0.84

    blur {
        enabled = true
        size = 10
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        vibrancy = 0.28
        vibrancy_darkness = 0.2
        contrast = 1.0
        brightness = 0.9
        noise = 0.02
        special = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000070)
    }
}
