exec-once = waybar
exec-once = swaync
# o wallpaper.sh já sobe o swaybg; --restore reaplica o último usado
exec-once = ~/.config/hypr/scripts/wallpaper.sh --restore
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# blueman-applet removido — duplicava o módulo bluetooth do waybar (mesmo
# estado "desligado" mostrado duas vezes, um pela bandeja outro pelo
# módulo custom). O clique no módulo já abre o blueman-manager.
