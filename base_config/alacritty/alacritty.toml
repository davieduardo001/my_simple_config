# Alacritty (tema Kanagawa Dragon).
# Formato TOML (alacritty >= 0.13).

[env]
TERM = "alacritty"

# --- Font ---
[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

# --- Window ---
[window]
padding = { x = 10, y = 10 }
dynamic_padding = false
decorations = "full"
opacity = 1.0

# --- Scrollback ---
[scrolling]
history = 10000

# --- Cursor ---
[cursor]
style = { shape = "Block", blinking = "On" }

# --- Theme (Kanagawa Dragon) ---
[colors.primary]
background = "#181616"
foreground = "#c5c9c5"

[colors.cursor]
cursor = "#c5c9c5"
text = "#181616"

[colors.selection]
background = "#2d4f67"
text = "#c8c093"

[colors.normal]
black   = "#0d0c0c"
red     = "#c4746e"
green   = "#8a9a7b"
yellow  = "#c4b28a"
blue    = "#8ba4b0"
magenta = "#a292a3"
cyan    = "#8ea4a2"
white   = "#c8c093"

[colors.bright]
black   = "#a6a69c"
red     = "#e46876"
green   = "#87a987"
yellow  = "#e6c384"
blue    = "#7fb4ca"
magenta = "#957fb8"
cyan    = "#7aa89f"
white   = "#c5c9c5"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
