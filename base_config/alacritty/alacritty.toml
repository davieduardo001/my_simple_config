# Alacritty (tema Aura).
# Formato TOML (alacritty >= 0.13).

[env]
TERM = "alacritty"

# --- Font ---
[font]
size = 11

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

# --- Window ---
[window]
padding = { x = 10, y = 10 }
dynamic_padding = false
decorations = "full"
opacity = 1.0

# --- Scrollback ---
[scrolling]
history = 10000

# --- Cursor ---
[cursor]
style = { shape = "Block", blinking = "On" }

# --- Theme (Aura) ---
[colors.primary]
background = "#15141b"
foreground = "#edecee"

[colors.cursor]
cursor = "#a277ff"
text = "#15141b"

[colors.selection]
text = "CellForeground"
background = "#29263c"

[colors.normal]
black   = "#110f18"
red     = "#ff6767"
green   = "#61ffca"
yellow  = "#ffca85"
blue    = "#a277ff"
magenta = "#a277ff"
cyan    = "#61ffca"
white   = "#edecee"

[colors.bright]
black   = "#4d4d4d"
red     = "#ff6767"
green   = "#61ffca"
yellow  = "#ffca85"
blue    = "#a277ff"
magenta = "#a277ff"
cyan    = "#61ffca"
white   = "#edecee"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
