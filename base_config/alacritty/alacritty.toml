# Alacritty (tema Aura).
# Formato TOML (alacritty >= 0.13).

[env]
TERM = "alacritty"

# --- Font ---
[font]
size = 11

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

# --- Window ---
[window]
padding = { x = 10, y = 10 }
dynamic_padding = false
decorations = "full"
opacity = 1.0

# --- Scrollback ---
[scrolling]
history = 10000

# --- Cursor ---
[cursor]
style = { shape = "Block", blinking = "On" }

# --- Theme (WhiteSur gray) ---
[colors.primary]
background = "#1C1C1E"
foreground = "#F2F2F7"

[colors.cursor]
cursor = "#AEAEB2"
text = "#1C1C1E"

[colors.selection]
text = "CellForeground"
background = "#3A3A3C"

[colors.normal]
black   = "#110f18"
red     = "#ff6767"
green   = "#61ffca"
yellow  = "#ffca85"
blue    = "#AEAEB2"
magenta = "#AEAEB2"
cyan    = "#61ffca"
white   = "#F2F2F7"

[colors.bright]
black   = "#5A5A5E"
red     = "#ff6767"
green   = "#61ffca"
yellow  = "#ffca85"
blue    = "#AEAEB2"
magenta = "#AEAEB2"
cyan    = "#61ffca"
white   = "#F2F2F7"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Copiar / colar (padrão moderno: Ctrl+Shift+C/V)
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

# Seleção com mouse copia direto pro clipboard
[selection]
save_to_clipboard = true
